buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Modernized plugin engine layout that natively handles Android 16 SDK matrices
        classpath 'com.android.tools.build:gradle:8.4.2'
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
